<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GameFal — Patio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#cfe6df;overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{display:flex;justify-content:center;align-items:center}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="g"></canvas>
<script>
'use strict';
const cv = document.getElementById('g');
const ctx = cv.getContext('2d');

// ── Virtual portrait canvas ─────────────────────────────────
const VW = 390, VH = 844;
let dpr = 1, scale = 1, offX = 0, offY = 0;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  cv.width  = Math.floor(w * dpr);
  cv.height = Math.floor(h * dpr);
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  scale = Math.max(w / VW, h / VH);          // cover
  offX = (w - VW * scale) / 2;
  offY = (h - VH * scale) / 2;
}
resize();
window.addEventListener('resize', resize);

const reduce = window.matchMedia &&
  window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ── Prado Suave palette (soft natural) ──────────────────────
const P = {
  sky1:'#B7DCE6', sky2:'#EBF5E6', sun:'#FFD98A', sunGlow:'rgba(255,220,140,',
  cloud:'#FEFDF7',
  hedge:'#537E37', hedge2:'#456B2E',
  grassT:'#98C05E', grassM:'#7AA945', grassD:'#5E893A',
  path:'#D6B27C', pathL:'#E7CE9C',
  wall:'#F0E0B6', wallSh:'#DBC68C',
  roof:'#D06A4E', roofSh:'#B0543C', roofEdge:'#E58A6E',
  door:'#93613C', doorDark:'#4E3320', knob:'#F0D48A',
  win:'#AEDCEA', winSh:'#8FC3D4', frame:'#F0E0B6',
  smoke:'#F4F1E9',
  trunk:'#8F5C38', trunkSh:'#734828', leaf1:'#79AA4A', leaf2:'#5E8C3A', leaf3:'#8FBE5A',
  skin:'#F5CBA0', cloth:'#E4995A', cloth2:'#C87C40', bib:'#EEA968', cheek:'#EFA579',
  ink:'#4A3524',
  fl1:'#EC7091', fl2:'#F5B549', fl3:'#F0DA55', fl4:'#C98BD1',
  wing:'#F3B7C6'
};

// ── small draw helpers (virtual coords) ─────────────────────
function rrect(x,y,w,h,r,col){
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill();
}
function circ(x,y,r,col){ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
function ell(x,y,rx,ry,col){ ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,7); ctx.fill(); }
function poly(pts,col){
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(pts[0],pts[1]);
  for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]);
  ctx.closePath(); ctx.fill();
}
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

// ── scene geometry ──────────────────────────────────────────
const HORIZON = 500;
const HOUSE = {x:52, y:250, w:162, h:HORIZON-250};
const ROOF  = {lx:26, rx:240, ay:172, ax:133};
const CHIM  = {x:182, y:206, w:22, h:46};
const DOOR  = {x:106, y:362, w:52, h:HORIZON-362};
const WINL  = {x:70,  y:300, w:38, h:38};
const WINR  = {x:158, y:300, w:38, h:38};
const TREE  = {x:322, cy:300, r:74, trunkTop:296};

// ── mutable ambient state ───────────────────────────────────
let smoke = [], smokeTimer = 0;
let clouds = [{x:90,y:110,s:1},{x:300,y:80,s:.8},{x:200,y:160,s:.6}];
let butterfly = {t:0};
let blinkTimer = 2.4, blinking = 0;

// character animation timeline
const START = performance.now();
const APPEAR = 1.35, WALK0 = 1.7, WALK1 = 4.3;
const charStart = {x:132, y:552, s:.86};
const charEnd   = {x:188, y:684, s:1.14};
let replayAt = 0;

function elapsed(now){ return (now - START)/1000 - replayAt; }

// ── background pieces ───────────────────────────────────────
function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,HORIZON);
  g.addColorStop(0,P.sky1); g.addColorStop(1,P.sky2);
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,HORIZON);
}
function drawSun(t){
  const x=312, y=118, pulse = reduce?0:Math.sin(t*.8)*.06;
  for(let i=3;i>=1;i--){
    ctx.fillStyle = P.sunGlow + (0.16*i*(0.9+pulse)) + ')';
    ctx.beginPath(); ctx.arc(x,y,46 + i*20,0,7); ctx.fill();
  }
  circ(x,y,46,P.sun);
  circ(x-4,y-4,40,'#FFE6A6');
}
function drawCloud(x,y,s){
  ctx.save(); ctx.globalAlpha=.96;
  ell(x,y,34*s,20*s,P.cloud); ell(x-28*s,y+6*s,22*s,15*s,P.cloud);
  ell(x+30*s,y+7*s,24*s,16*s,P.cloud); ell(x+4*s,y-12*s,20*s,15*s,P.cloud);
  ctx.restore();
}
function drawHedge(){
  rrect(-20,HORIZON-46,VW+40,60,26,P.hedge);
  for(let x=0;x<=VW;x+=44) circ(x,HORIZON-46,26,P.hedge);
  for(let x=22;x<=VW;x+=44) circ(x,HORIZON-40,20,P.hedge2);
}
function drawGround(){
  const g = ctx.createLinearGradient(0,HORIZON,0,VH);
  g.addColorStop(0,P.grassT); g.addColorStop(.6,P.grassM); g.addColorStop(1,P.grassD);
  ctx.fillStyle=g; ctx.fillRect(0,HORIZON,VW,VH-HORIZON);
  ctx.fillStyle='rgba(255,255,255,.08)';
  ctx.beginPath(); ctx.ellipse(150,HORIZON+70,220,60,0,0,7); ctx.fill();
}
function drawPath(){
  const cx = DOOR.x + DOOR.w/2;
  poly([cx-24,HORIZON, cx+24,HORIZON, 268,VH, 20,VH], P.path);
  poly([cx-13,HORIZON, cx+13,HORIZON, 210,VH, 78,VH], P.pathL);
  ctx.fillStyle='rgba(255,255,255,.14)';
  for(let i=0;i<4;i++){
    const p=i/3.2, y=lerp(HORIZON+30,VH-30,p), rx=lerp(16,40,p);
    ctx.beginPath(); ctx.ellipse(lerp(cx,150,p), y, rx, rx*.4,0,0,7); ctx.fill();
  }
}
function drawHouse(doorOpen){
  rrect(HOUSE.x,HOUSE.y,HOUSE.w,HOUSE.h,6,P.wall);
  ctx.fillStyle=P.wallSh; ctx.fillRect(HOUSE.x,HOUSE.y+HOUSE.h*0.62,HOUSE.w,HOUSE.h*0.38);
  rrect(CHIM.x,CHIM.y,CHIM.w,CHIM.h,3,P.roofSh);
  poly([ROOF.lx,HOUSE.y+4, ROOF.ax,ROOF.ay, ROOF.rx,HOUSE.y+4], P.roof);
  poly([ROOF.ax,ROOF.ay, ROOF.rx,HOUSE.y+4, ROOF.rx-14,HOUSE.y+4], P.roofSh);
  poly([ROOF.lx,HOUSE.y+4, ROOF.ax,ROOF.ay, ROOF.ax,ROOF.ay+7, ROOF.lx,HOUSE.y+11], P.roofEdge);
  [WINL,WINR].forEach(w=>{
    rrect(w.x,w.y,w.w,w.h,6,P.win);
    poly([w.x,w.y,w.x+w.w,w.y,w.x+w.w,w.y+8,w.x,w.y+16],P.winSh);
    ctx.fillStyle=P.frame;
    ctx.fillRect(w.x+w.w/2-1.5,w.y,3,w.h); ctx.fillRect(w.x,w.y+w.h/2-1.5,w.w,3);
    ctx.lineWidth=2.5; ctx.strokeStyle=P.wallSh; ctx.strokeRect(w.x,w.y,w.w,w.h);
  });
  rrect(DOOR.x,DOOR.y,DOOR.w,DOOR.h,4,P.doorDark);
  const dw = DOOR.w*(1-0.80*doorOpen);
  const sk = doorOpen*7;
  poly([DOOR.x,DOOR.y, DOOR.x+dw,DOOR.y+sk, DOOR.x+dw,DOOR.y+DOOR.h-sk, DOOR.x,DOOR.y+DOOR.h], P.door);
  if(doorOpen<0.6) circ(DOOR.x+dw-6,DOOR.y+DOOR.h/2,2.6,P.knob);
}
function drawTree(t){
  const sway = reduce?0:Math.sin(t*1.1)*3;
  rrect(TREE.x-9,TREE.trunkTop,18,HORIZON-TREE.trunkTop+22,4,P.trunk);
  ctx.fillStyle=P.trunkSh; ctx.fillRect(TREE.x+2,TREE.trunkTop,7,HORIZON-TREE.trunkTop+22);
  ctx.save(); ctx.translate(sway,0);
  circ(TREE.x,TREE.cy,TREE.r,P.leaf2);
  circ(TREE.x-40,TREE.cy+16,44,P.leaf1);
  circ(TREE.x+38,TREE.cy+12,40,P.leaf1);
  circ(TREE.x,TREE.cy-30,42,P.leaf3);
  circ(TREE.x-18,TREE.cy+2,30,P.leaf3);
  circ(TREE.x-24,TREE.cy+8,5,P.fl1); circ(TREE.x+28,TREE.cy-6,5,P.fl1);
  circ(TREE.x+6,TREE.cy+28,5,P.fl1);
  ctx.restore();
}
function drawFlowers(t){
  const F=[[60,590,P.fl1],[92,632,P.fl2],[300,700,P.fl3],[338,640,P.fl4],
           [44,720,P.fl2],[264,600,P.fl1],[120,760,P.fl3]];
  F.forEach((f,i)=>{
    const sway = reduce?0:Math.sin(t*1.6+i)*2.2;
    ctx.strokeStyle=P.leaf2; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(f[0],f[1]); ctx.lineTo(f[0]+sway,f[1]-16); ctx.stroke();
    const cx=f[0]+sway, cy=f[1]-18;
    for(let p=0;p<5;p++){ const a=p/5*6.283; circ(cx+Math.cos(a)*5,cy+Math.sin(a)*5,4,f[2]); }
    circ(cx,cy,3.4,P.sun);
  });
}
function drawGrass(t){
  for(let x=-6;x<VW+6;x+=13){
    const sway = reduce?0:Math.sin(t*1.8 + x*0.15)*3;
    const h = 12 + (x*7%9);
    const col = (Math.floor(x)%2)?P.grassD:P.grassM;
    poly([x,VH, x+3+sway,VH-h, x+6,VH], col);
  }
}

// ── the little sprout kid (muñeco) ──────────────────────────
function drawChar(cx, footY, s, st){
  ctx.save(); ctx.globalAlpha=.18; ctx.fillStyle='#274017';
  ctx.beginPath(); ctx.ellipse(cx,footY+2,26*s,7*s,0,0,7); ctx.fill(); ctx.restore();

  ctx.save(); ctx.translate(cx,footY); ctx.scale(s,s);
  const move = st.move;
  const lp = st.legPhase;
  const liftL = move?Math.max(0,Math.sin(lp))*7:0;
  const liftR = move?Math.max(0,Math.sin(lp+Math.PI))*7:0;
  const swing = move?Math.sin(lp)*5:0;
  const bob   = move?-Math.abs(Math.sin(lp))*4 : Math.sin(st.idle)*-1.6;

  // legs + feet
  rrect(-13,-26, 9,26-liftL,4,P.cloth2);
  rrect(4,-26, 9,26-liftR,4,P.cloth2);
  ell(-8.5,-(liftL),8,5,P.trunk);
  ell(8.5,-(liftR),8,5,P.trunk);

  ctx.save(); ctx.translate(0,bob);
  // arms (behind body)
  rrect(-20-swing,-70,7,26,4,P.cloth);
  circ(-16.5-swing,-45,4.5,P.skin);
  rrect(13+swing,-70,7,26,4,P.cloth);
  circ(16.5+swing,-45,4.5,P.skin);
  // body / overalls
  rrect(-16,-72,32,50,10,P.cloth);
  rrect(-13,-58,26,26,7,P.bib);
  ctx.fillStyle=P.cloth2; ctx.fillRect(-9,-72,4,16); ctx.fillRect(5,-72,4,16);
  circ(-7,-58,2,P.knob); circ(7,-58,2,P.knob);
  // head
  circ(0,-92,23,P.skin);
  ell(0,-84,23,20,P.skin);
  // sprout on top
  ctx.strokeStyle=P.leaf2; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,-113); ctx.lineTo(0,-124); ctx.stroke();
  poly([0,-124, 15,-132, 3,-118], P.leaf1);
  poly([0,-121, -13,-130, -2,-115], P.leaf3);
  // cheeks
  ctx.globalAlpha=.55; circ(-11,-86,4.5,P.cheek); circ(11,-86,4.5,P.cheek); ctx.globalAlpha=1;
  // eyes (blink)
  if(st.blink>0.5){
    ctx.strokeStyle=P.ink; ctx.lineWidth=2.4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-11,-93); ctx.lineTo(-4,-93);
    ctx.moveTo(4,-93); ctx.lineTo(11,-93); ctx.stroke();
  } else {
    circ(-7.5,-93,3,P.ink); circ(7.5,-93,3,P.ink);
    circ(-6.5,-94,1,'#fff'); circ(8.5,-94,1,'#fff');
  }
  // smile
  ctx.strokeStyle=P.ink; ctx.lineWidth=2.2; ctx.beginPath();
  ctx.arc(0,-86,5,0.25,Math.PI-0.25); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

function drawButterfly(){
  if(reduce) return;
  const bt = butterfly.t;
  const x = 250 + Math.sin(bt*0.7)*90 + Math.cos(bt*1.9)*14;
  const y = 560 + Math.sin(bt*1.3)*60 + Math.cos(bt*0.9)*20;
  const flap = Math.abs(Math.sin(bt*10))*0.8 + 0.2;
  ctx.save(); ctx.translate(x,y);
  const wx = 9*flap;
  ell(-wx,-2,8,6,P.fl4); ell(wx,-2,8,6,P.fl4);
  ell(-wx*.8,5,6,5,P.wing); ell(wx*.8,5,6,5,P.wing);
  ctx.fillStyle=P.ink; ctx.fillRect(-1,-6,2,12);
  ctx.restore();
}

// ── update + render ─────────────────────────────────────────
function update(dt,t){
  smokeTimer -= dt;
  if(smokeTimer<=0 && !reduce){
    smoke.push({x:CHIM.x+CHIM.w/2, y:CHIM.y-2, r:6, life:0, drift:(Math.random()-.5)});
    smokeTimer = 0.7;
  }
  smoke.forEach(p=>{ p.life+=dt*0.32; p.y-=dt*18; p.x+=p.drift*dt*10; p.r+=dt*7; });
  smoke = smoke.filter(p=>p.life<1);
  clouds.forEach(c=>{ c.x += dt*(6*c.s); if(c.x>VW+60) c.x=-60; });
  butterfly.t += dt;
  blinkTimer -= dt;
  if(blinkTimer<=0){ blinking=0.13; blinkTimer=2.2+Math.random()*3.2; }
  if(blinking>0) blinking-=dt;
}

function render(t){
  ctx.setTransform(dpr*scale,0,0,dpr*scale, dpr*offX, dpr*offY);
  ctx.clearRect(-offX/scale-2,-offY/scale-2, VW+Math.abs(offX)*2/scale+4, VH+Math.abs(offY)*2/scale+4);

  drawSky();
  drawSun(t);
  clouds.forEach(c=>drawCloud(c.x,c.y,c.s));
  drawHedge();
  drawGround();
  drawPath();

  const doorOpen = reduce?1:clamp((t-0.8)/0.8,0,1);
  drawHouse(doorOpen);

  smoke.forEach(p=>{ ctx.save(); ctx.globalAlpha=(1-p.life)*0.6; circ(p.x,p.y,p.r,P.smoke); ctx.restore(); });

  drawTree(t);
  drawFlowers(t);

  const vis = reduce?true:(t>=APPEAR);
  if(vis){
    const wp = reduce?1:clamp((t-WALK0)/(WALK1-WALK0),0,1);
    const e = easeIO(wp);
    const cx = lerp(charStart.x, charEnd.x, e);
    const cy = lerp(charStart.y, charEnd.y, e);
    const cs = lerp(charStart.s, charEnd.s, e);
    const move = !reduce && t>=WALK0 && wp<1;
    drawChar(cx, cy, cs, { move, legPhase:t*9, idle:t*2.2, blink: blinking>0?1:0 });
  }

  drawButterfly();
  drawGrass(t);

  const v = ctx.createRadialGradient(VW/2,VH*0.4,180,VW/2,VH*0.55,560);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(20,30,15,.16)');
  ctx.fillStyle=v; ctx.fillRect(0,0,VW,VH);
}

// ── loop ────────────────────────────────────────────────────
let last = START;
function frame(now){
  const dt = Math.min((now-last)/1000, 0.05); last = now;
  const t = elapsed(now);
  update(dt, t);
  render(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// tap to replay the little entrance
cv.addEventListener('pointerdown', ()=>{
  replayAt = (performance.now()-START)/1000;
  smoke = [];
});
</script>
</body>
</html>
